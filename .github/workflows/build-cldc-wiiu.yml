name: Compilar VM J2ME para Wii U
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - name: Dependencias (gcc 32 bits, make)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib make zip unzip wget git
      - name: devkitPro (wiiu-dev)
        run: |
          wget -q https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -S --noconfirm wiiu-dev
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitPPC/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
      - name: Descargar phoneME
        run: git clone --depth 1 https://github.com/magicus/phoneME phoneME
      - name: Aplicar plataforma Wii U
        run: python3 apply_overlay.py phoneME
      - name: Compilar VM
        working-directory: phoneME/cldc/build/wiiu_c
        env:
          JVMWorkSpace: ${{ github.workspace }}/phoneME/cldc
          JDK_DIR: ${{ env.JAVA_HOME }}
        run: |
          set -o pipefail
          make product ENABLE_COMPILATION_WARNINGS=true ROMIZING=false ENABLE_JNI=false 2>&1 | tee ${{ github.workspace }}/build.log
      - name: Generar .rpx y reunir resultados
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          find phoneME/cldc/build -maxdepth 4 -type f -name 'cldc_vm*' | tee out/archivos_vm.txt
          VM=$(find phoneME/cldc/build -type f -name 'cldc_vm' -path '*product*' | head -1)
          if [ -n "$VM" ]; then cp "$VM" out/cldc_vm.elf; elf2rpl out/cldc_vm.elf out/cldc_vm.rpx; fi
          [ -d phoneME/cldc/build/classes ] && (cd phoneME/cldc/build/classes && zip -qr ${{ github.workspace }}/out/classes.zip .)
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: resultado-wiiu, path: out/ }
